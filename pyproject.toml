[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd-adaptive-monitor"
version = "0.1.0"
description = "Qiskit research prototype for QKD channel adaptive monitoring"
requires-python = ">=3.11"
dependencies = ["qiskit==2.5.2", "qiskit-aer==0.17.2", "numpy>=2.0,<3", "scipy>=1.14", "pandas>=2.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
